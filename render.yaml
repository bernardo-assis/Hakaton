# Review the free-tier limitations in docs/DEPLOYMENT.md before provisioning.
services:
  - type: web
    name: agentsafe-api
    runtime: docker
    branch: bernardo
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /readyz
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: agentsafe-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: AUTH_ALLOWED_ORIGINS
        sync: false
      - key: VAULT_SIGNER_ENCRYPTION_KEY
        sync: false
      - key: DEVNET_PAYMENTS_ENABLED
        value: "false"
      - key: SOLANA_RPC_URL
        value: https://api.devnet.solana.com
databases:
  - name: agentsafe-db
    plan: free
    region: oregon
    databaseName: agentsafe
    user: agentsafe
    ipAllowList: []
