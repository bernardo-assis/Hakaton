<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- High-contrast Obsidian Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#060D0C"/>
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="#1B382E" stroke-width="2"/>

  <!-- Radial Cyber Glow -->
  <defs>
    <radialGradient id="agGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B6F03F" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#B6F03F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="22" fill="url(#agGlow)"/>

  <!-- AgentSafe Defense Shield -->
  <path d="M32 14C24.5 17.2 18.5 17.8 18.5 25.5C18.5 36.5 25.5 45 32 49C38.5 45 45.5 36.5 45.5 25.5C45.5 17.8 39.5 17.2 32 14Z" 
        fill="#064E3B" 
        stroke="#B6F03F" 
        stroke-width="2.5" 
        stroke-linejoin="round"/>

  <!-- Crisp Shield Checkmark / Firewall Gate -->
  <path d="M26.5 31.5L30.5 35.5L37.5 26.5" 
        stroke="#B6F03F" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- AgentSafe Active Status Dot -->
  <circle cx="45" cy="17" r="4" fill="#B6F03F"/>
  <circle cx="45" cy="17" r="1.8" fill="#FFFFFF"/>
</svg>