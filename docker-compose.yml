services:
  postgres:
    image: postgres:15-alpine
    container_name: agentsafe_pg
    environment:
      POSTGRES_USER: agentsafe
      POSTGRES_PASSWORD: agentsafe_password
      POSTGRES_DB: agentsafe_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/migrations:/docker-entrypoint-initdb.d
    restart: unless-stopped

  adminer:
    image: adminer
    container_name: agentsafe_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  pgdata:
