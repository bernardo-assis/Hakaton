name: agentsafe-demo
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: agentsafe_demo
      POSTGRES_DB: agentsafe_demo
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [demo_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U agentsafe_demo -d agentsafe_demo"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL_FILE: /run/secrets/database_url
      VAULT_SIGNER_ENCRYPTION_KEY_FILE: /run/secrets/vault_key
      AUTH_ALLOWED_ORIGINS: "http://localhost:${DEMO_HTTP_PORT:-8088},http://127.0.0.1:${DEMO_HTTP_PORT:-8088}"
      TRUST_PROXY_HOPS: 1
      DEVNET_PAYMENTS_ENABLED: ${DEVNET_PAYMENTS_ENABLED:-false}
      SOLANA_RPC_URL: https://api.devnet.solana.com
    secrets: [database_url, vault_key]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:${DEMO_HTTP_PORT:-8088}:8080"]
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
volumes:
  demo_pgdata:
secrets:
  postgres_password: {file: ./.demo-secrets/postgres_password}
  database_url: {file: ./.demo-secrets/database_url}
  vault_key: {file: ./.demo-secrets/vault_key}
